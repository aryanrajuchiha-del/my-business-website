
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La Bella - Restaurant</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#fffaf5;
    color:#242424;
}

/* ================= NAVBAR ================= */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;
    padding:20px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(255,250,245,.92);
    backdrop-filter:blur(12px);
    border-bottom:1px solid #eee;
}

.logo{
    font-family:Georgia,serif;
    font-size:30px;
    font-weight:bold;
    color:#b85c38;
}

.logo span{
    color:#222;
}

nav{
    display:flex;
    gap:30px;
}

nav a{
    text-decoration:none;
    color:#333;
    font-size:15px;
    font-weight:600;
}

nav a:hover{
    color:#b85c38;
}

.book-btn{
    background:#b85c38;
    color:white!important;
    padding:12px 22px;
    border-radius:30px;
}

/* ================= HERO ================= */

.hero{
    min-height:100vh;
    padding:150px 7% 80px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:60px;
    align-items:center;
}

.hero-text small{
    color:#b85c38;
    font-weight:bold;
    letter-spacing:3px;
}

.hero-text h1{
    font-family:Georgia,serif;
    font-size:clamp(50px,6vw,82px);
    line-height:1.05;
    margin:20px 0;
}

.hero-text h1 span{
    color:#b85c38;
}

.hero-text p{
    color:#666;
    max-width:550px;
    font-size:18px;
    line-height:1.8;
    margin-bottom:30px;
}

.buttons{
    display:flex;
    gap:15px;
}

.btn{
    text-decoration:none;
    padding:15px 27px;
    border-radius:30px;
    font-weight:bold;
}

.primary{
    background:#b85c38;
    color:white;
}

.secondary{
    border:1px solid #b85c38;
    color:#b85c38;
}

.hero-image{
    position:relative;
}

.hero-image img{
    width:100%;
    height:600px;
    object-fit:cover;
    border-radius:180px 180px 25px 25px;
}

.rating{
    position:absolute;
    bottom:30px;
    left:-25px;
    background:white;
    padding:18px 25px;
    border-radius:15px;
    box-shadow:0 15px 40px rgba(0,0,0,.12);
}

.rating strong{
    display:block;
    font-size:22px;
}

.stars{
    color:#e6a100;
}

/* ================= COMMON ================= */

section{
    padding:100px 7%;
}

.section-heading{
    text-align:center;
    margin-bottom:55px;
}

.section-heading small{
    color:#b85c38;
    letter-spacing:3px;
    font-weight:bold;
