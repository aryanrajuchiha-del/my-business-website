
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Royal Spice | Restaurant</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: #fff;
      line-height: 1.6;
    }

    /* NAVBAR */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 7%;
      background: rgba(10, 10, 10, 0.95);
      border-bottom: 1px solid #292929;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #d4af37;
    }

    .logo span {
      color: white;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 30px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 15px;
      transition: 0.3s;
    }

    nav a:hover {
      color: #d4af37;
    }

    .nav-btn {
      background: #d4af37;
      color: #111;
      padding: 10px 18px;
      border-radius: 25px;
      font-weight: bold;
    }

    /* HERO */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 120px 7% 70px;
      background:
        linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.8)),
        url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1800&q=80")
        center/cover;
    }

    .hero-content {
      max-width: 700px;
    }

    .hero small {
      color: #d4af37;
      font-size: 18px;
      letter-spacing: 3px;
    }

    .hero h1 {
      font-size: clamp(45px, 7vw, 85px);
      line-height: 1.05;
      margin: 20px 0;
    }

    .hero h1 span {
      color: #d4af37;
    }

    .hero p {
      color: #ddd;
      font-size: 18px;
      max-width: 580px;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 14px 27px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      margin-right: 10px;
      transition: .3s;
    }

    .primary {
      background: #d4af37;
      color: #111;
    }

    .secondary {
      border: 1px solid #d4af37;
      color: #d4af37;
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    /* GENERAL */
    section {
      padding: 90px 7%;
    }

    .section-title {
      text-align: center;
      margin-bottom: 45px;
    }

    .section-title small {
      color: #d4af37;
      letter-spacing: 3px;
    }

    .section-title h2 {
      font-size: 42px;
      margin-top: 10px;
    }

    /* ABOUT */
    .about {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: center;
    }

      border
